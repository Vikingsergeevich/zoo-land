server {
    listen 80;
    server_name localhost;

    # Frontend
    location / {
        proxy_pass http://zoo-land-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Strapi Admin
    location /admin {
        proxy_pass http://zoo-land-backend:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Добавляем заголовки CSP
        add_header Content-Security-Policy "default-src 'self' http://localhost http://localhost:1337; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost http://localhost:1337; style-src 'self' 'unsafe-inline' http://localhost http://localhost:1337; img-src 'self' data: http://localhost http://localhost:1337; font-src 'self' data: http://localhost http://localhost:1337; connect-src 'self' http://localhost http://localhost:1337 ws://localhost ws://localhost:1337;";
        
        # Добавляем заголовки для правильной работы Strapi
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strapi API
    location /api {
        proxy_pass http://zoo-land-backend:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Добавляем заголовки для правильной работы Strapi
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

