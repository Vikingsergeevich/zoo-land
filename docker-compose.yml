version: '3.8'

services:
  zoo-land-frontend:
    build:
      context: ./zoo-land-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./zoo-land-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - zoo-land-backend

  zoo-land-backend:
    build:
      context: ./zoo-land-backend
      dockerfile: Dockerfile
    ports:
      - "1337:1337"
    volumes:
      - ./zoo-land-backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=zoo_land
      - DATABASE_USERNAME=user
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - URL=${URL}
      - ADMIN_URL=${ADMIN_URL}
      - STRAPI_ADMIN_BACKEND_URL=${STRAPI_ADMIN_BACKEND_URL}
      - STRAPI_TELEMETRY_DISABLED=${STRAPI_TELEMETRY_DISABLED}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=zoo_land
      - MYSQL_USER=user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - zoo-land-frontend
      - zoo-land-backend

volumes:
  mysql-data:
